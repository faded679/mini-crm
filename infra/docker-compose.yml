services:
  db:
    image: postgres:16-alpine
    container_name: mini-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mini_crm
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - mini_crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
    container_name: mini-crm-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mini_crm_uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mini_crm?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://sologo.ru,https://crm.sologo.ru,https://app.sologo.ru,https://warehouse.sologo.ru,https://logist.sologo.ru,https://test.ved31.ru}
      PORT: "3000"
      DADATA_TOKEN: ${DADATA_TOKEN}
      TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY:-}
      TBANK_SECRET_KEY: ${TBANK_SECRET_KEY:-}
      TBANK_API_URL: ${TBANK_API_URL:-https://securepay.tinkoff.ru/v2}
      API_BASE_URL: ${API_BASE_URL:-https://test.ved31.ru/api}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://sologo.ru}
      ZVONOK_PUBLIC_KEY: ${ZVONOK_PUBLIC_KEY:-}
      ZVONOK_CAMPAIGN_ID: ${ZVONOK_CAMPAIGN_ID:-}
      ZVONOK_VERIFICATION_NUMBER: ${ZVONOK_VERIFICATION_NUMBER:-+78005558607}
      EMAIL_SERVICE_URL: http://host.docker.internal:5001

  bot:
    build:
      context: ../apps/bot
    container_name: mini-crm-bot
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_URL: http://mini-crm-api:3000
      MINI_APP_URL: ${MINI_APP_URL:-https://test.ved31.ru/app/}

  mini-app:
    build:
      context: ../apps/mini-app
      args:
        VITE_API_URL: ${VITE_API_URL:-https://test.ved31.ru/api}
    container_name: mini-crm-mini-app
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-https://sologo.ru/api}
        VITE_BASE_PATH: /
    container_name: mini-crm-web
    restart: unless-stopped

  public:
    build:
      context: ../apps/public
      args:
        VITE_API_URL: ${VITE_API_URL:-https://sologo.ru/api}
        VITE_BASE_PATH: /
    container_name: mini-crm-public
    restart: unless-stopped

  logist:
    build:
      context: ../apps/logist
      args:
        VITE_API_URL: ${VITE_API_URL:-https://sologo.ru/api}
    container_name: mini-crm-logist
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mini-crm-nginx
    restart: unless-stopped
    depends_on:
      - api
      - mini-app
      - web
      - public
      - logist
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - default
      - mini_crm_demo_net

volumes:
  mini_crm_pgdata:
  mini_crm_uploads:

networks:
  default:
    name: infra_default
  mini_crm_demo_net:
    external: true
    name: mini_crm_demo_net

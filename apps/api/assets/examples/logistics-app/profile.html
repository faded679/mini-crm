<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#D84B55" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Соловьев-Экспресс" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo512.png" />
    <title>Профиль</title>
    <style>
      :root { --bg:#f3f5f7; --card:#fff; --text:#27384a; --muted:#6f7f8f; --accent:#d84b55; --nav-bg:#e7ebf0; }
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; touch-action: manipulation; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); }
      .app { max-width: 420px; margin: 0 auto; height: 100svh; padding: 14px 14px 122px; overflow: hidden; }
      .card { background: var(--card); border-radius: 22px; padding: 16px; box-shadow: 0 10px 22px rgba(39,56,74,.1); margin-bottom: 12px; }
      h1 { margin:0 0 12px; font-size:22px; color:var(--text); }
      p { margin: 6px 0; font-size: 14px; }
      .sum-title { color:var(--muted); }
      .sum-value { margin: 6px 0 2px; font-size: 34px; font-weight: 700; color: var(--accent); }
      .nav { position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:100%; max-width:420px; background:var(--nav-bg); border-top:1px solid #d7dfe7; padding:12px 10px calc(14px + env(safe-area-inset-bottom)); }
      .nav-row { display:flex; align-items:center; gap:8px; }
      .nav-main { width:66.666%; display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
      .nav-item { text-decoration:none; color:var(--text); text-align:center; font-size:12px; padding:6px 2px; border-radius:12px; }
      .nav-item .icon { display:block; line-height:1; margin-bottom:5px; }
      .nav-item .icon svg { width:24px; height:24px; display:block; margin:0 auto; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .nav-item.active { color:var(--accent); font-weight:700; }
      .sum-box { width:33.333%; background:#fff; border-radius:20px; min-height:64px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:600; color:var(--text); }
      .home-indicator { width:120px; height:5px; background:#000; border-radius:999px; opacity:.65; margin:10px auto 0; }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Профиль</h1>
      <section class="card">
        <p><strong>Компания:</strong> ООО "Соловьев-Экспресс"</p>
        <p><strong>Телефон:</strong> +7 (901) 345-67-89</p>
        <p><strong>ИНН:</strong> 7701234567</p>
      </section>

      <section class="card">
        <p class="sum-title">Баланс клиента</p>
        <p class="sum-value">12 600 ₽</p>
        <p><strong>Последняя операция:</strong> Пополнение</p>
        <p><strong>Дата:</strong> 14.03.2026</p>
        <p><strong>История операция</strong> href="/profile.html"</p>
      </section>
    </main>

    <nav class="nav">
      <div class="nav-row">
        <div class="nav-main">
          <a class="nav-item" href="/index.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg></span>Главная</a>
          <a class="nav-item" href="/orders.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg></span>Заявки</a>
          <a class="nav-item active" href="/profile.html"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.8-3.8 5-5.5 8-5.5s6.2 1.7 8 5.5"></path></svg></span>Профиль</a>
        </div>
        <div class="sum-box">12 600 ₽</div>
      </div>
      <div class="home-indicator"></div>
    </nav>
  </body>
</html>
